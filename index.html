<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>PGRI Cabang Matraman — Portal Resmi & Pusat Layanan Guru</title>
    
    <meta name="description"
        content="Portal Resmi Persatuan Guru Republik Indonesia (PGRI) Cabang Matraman, Jakarta Timur. Warta organisasi, program kerja, galeri dokumentasi, kepengurusan, dan integrasi KTA Digital.">
    <meta name="keywords" content="PGRI, PGRI Matraman, Guru Matraman, Pendidikan Jakarta Timur, KTA PGRI, Warta Guru">
    <meta name="author" content="PGRI Cabang Matraman">
    <meta name="theme-color" content="#DA251B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PGRI Matraman">

    <!-- Open Graph & Social Preview Metadata -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PGRI Cabang Matraman — Portal Resmi & Informasi Terpadu">
    <meta property="og:description"
        content="Wadah perjuangan martabat guru, advokasi profesi, warta berkala, dan layanan anggota terpadu PGRI Cabang Matraman.">
    <meta property="og:image" content="./pgri-logo.png">
    <meta property="og:locale" content="id_ID">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PGRI Cabang Matraman — Portal Resmi & Informasi Terpadu">
    <meta name="twitter:description"
        content="Wadah perjuangan martabat guru, advokasi profesi, warta berkala, dan layanan anggota terpadu PGRI Cabang Matraman.">
    <meta name="twitter:image" content="./pgri-logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./pgri-logo.png">
    <link rel="apple-touch-icon" href="./pgri-logo.png">

    <style>
        /* Pure Zero-Margin & Zero-Padding Fullscreen Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Seamless Fullscreen Iframe — Langsung tampil instan tanpa animasi loading */
        #pgri-portal-frame {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            background-color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Fullscreen Google Apps Script Iframe Instan Tanpa Loading Screen -->
    <iframe id="pgri-portal-frame"
        src="https://script.google.com/macros/s/AKfycbx0KfH9ETgdSKzjv2mhl6tKMTnutJO0amZyi-cLi-Q6IOF3E1CGfbgRnB2x0zjrTgV6/exec"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share"
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-downloads"
        title="Portal Resmi PGRI Cabang Matraman">
    </iframe>

    <script>
        // Mencegah double-tap zoom delay pada perangkat mobile browser
        document.addEventListener('touchend', function (event) {
            const now = Date.now();
            if (now - (window.lastTouchEnd || now) <= 300) {
                event.preventDefault();
            }
            window.lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>

</html>
